<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus Alert 公車到站通知</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Bus Alert 公車到站通知</h1>

    <!-- 未登入時顯示 -->
    <section id="auth-section">
      <h2>登入／註冊</h2>
      <label>Email
        <input id="email" type="email" autocomplete="email">
      </label>
      <label>密碼（至少 8 字元）
        <input id="password" type="password" autocomplete="current-password">
      </label>
      <div class="row">
        <button id="login-btn">登入</button>
        <button id="register-btn" class="secondary">註冊</button>
      </div>
      <p id="auth-message" class="message"></p>
    </section>

    <!-- 登入後顯示 -->
    <section id="app-section" hidden>
      <p>已登入：<strong id="user-email"></strong>
        <button id="logout-btn" class="secondary">登出</button>
      </p>
      <h2>新增訂閱</h2>

        <label>縣市
        <select id="city">
            <option value="Taipei">台北市</option>
            <option value="NewTaipei">新北市</option>
            <option value="Taoyuan">桃園市</option>
            <option value="Taichung">台中市</option>
            <option value="Tainan" selected>台南市</option>
            <option value="Kaohsiung">高雄市</option>
        </select>
        </label>

        <label>搜尋路線（輸入路線號碼，例如 105）
        <div class="row">
            <input id="route-q" type="text">
            <button id="route-search-btn" type="button">搜尋</button>
        </div>
        </label>

        <label>路線
        <select id="route-select" disabled>
            <option value="">請先搜尋路線</option>
        </select>
        </label>

        <label>方向
        <select id="direction" disabled>
            <option value="0">去程</option>
            <option value="1">返程</option>
        </select>
        </label>

        <label>上車站牌
        <select id="stop-select" disabled>
            <option value="">請先選擇路線</option>
        </select>
        </label>

        <label>提前幾分鐘通知（1～30）
        <input id="notify-minutes" type="number" min="1" max="30" value="5">
        </label>

        <button id="subscribe-btn" type="button" disabled>訂閱</button>
        <p id="sub-message" class="message"></p>

        <h2>我的訂閱</h2>
        <ul id="sub-list"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
